<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="aiPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#skBg)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Circular Radar / Pulse -->
  <circle cx="300" cy="180" r="110" fill="none" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="180" r="80" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Glowing Security Shield -->
  <path d="M300 95 L365 125 C365 195 330 235 300 255 C270 235 235 195 235 125 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.15" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- AI Brain / Circuit Network Inside Shield -->
  <circle cx="300" cy="165" r="22" fill="#0b132b" stroke="#00f2fe" stroke-width="2"/>
  <circle cx="280" cy="145" r="5" fill="#4facfe"/>
  <circle cx="320" cy="145" r="5" fill="#4facfe"/>
  <circle cx="280" cy="185" r="5" fill="#00f2fe"/>
  <circle cx="320" cy="185" r="5" fill="#00f2fe"/>
  <line x1="280" y1="145" x2="300" y2="165" stroke="#00f2fe" stroke-width="1.5"/>
  <line x1="320" y1="145" x2="300" y2="165" stroke="#00f2fe" stroke-width="1.5"/>
  <line x1="280" y1="185" x2="300" y2="165" stroke="#00f2fe" stroke-width="1.5"/>
  <line x1="320" y1="185" x2="300" y2="165" stroke="#00f2fe" stroke-width="1.5"/>

  <!-- AI Lock / Checkmark -->
  <path d="M292 165 L298 171 L310 159" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- HUD Badges -->
  <rect x="36" y="32" width="130" height="28" rx="14" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="1"/>
  <text x="101" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#00f2fe" text-anchor="middle">AI FRAUD DETECTION</text>

  <rect x="424" y="32" width="140" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <circle cx="438" cy="46" r="4" fill="#10b981"/>
  <text x="495" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">RISK SCORE: 98.4%</text>

  <!-- Metric Badges Bottom -->
  <g transform="translate(180, 290)">
    <rect width="240" height="34" rx="8" fill="#111827" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
    <text x="120" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9ca3af" text-anchor="middle">
      XGBoost • SHAP Explainability • Real-Time
    </text>
  </g>
</svg>
