<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="crimeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="crimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#crimeBg)"/>

  <!-- Matrix / Data Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="260" y1="0" x2="260" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="460" y1="0" x2="460" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Central Folder / Record Dossier -->
  <rect x="220" y="110" width="160" height="120" rx="8" fill="#1f2937" stroke="#6366f1" stroke-width="2" filter="url(#crimeGlow)"/>
  <path d="M 220 120 L 220 115 C 220 112 223 110 226 110 L 265 110 L 280 125 L 374 125 C 377 125 380 127 380 130 L 380 140 Z" fill="#374151"/>

  <!-- File Lines / Records -->
  <rect x="245" y="145" width="110" height="8" rx="4" fill="#6366f1" fill-opacity="0.7"/>
  <rect x="245" y="165" width="80" height="8" rx="4" fill="#9ca3af" fill-opacity="0.5"/>
  <rect x="245" y="185" width="95" height="8" rx="4" fill="#9ca3af" fill-opacity="0.3"/>

  <!-- Digital Badge / Fingerprint / Shield Over Dossier -->
  <circle cx="340" cy="195" r="24" fill="#111827" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M333 195 L338 200 L349 189" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Category Badge Top Left -->
  <rect x="36" y="32" width="160" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1"/>
  <text x="116" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">FULL STACK / DATABASE</text>

  <!-- Secure Database Top Right -->
  <rect x="424" y="32" width="140" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="494" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">ENCRYPTED FIR REPO</text>

  <!-- Metric Badges Bottom -->
  <g transform="translate(160, 290)">
    <rect width="280" height="34" rx="8" fill="#111827" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
    <text x="140" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9ca3af" text-anchor="middle">
      Relational MySQL • FIR Logging • Police Analytics
    </text>
  </g>
</svg>
