<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="circleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gradient -->
  <circle cx="160" cy="160" r="150" fill="url(#avatarBg)"/>
  <circle cx="160" cy="160" r="146" fill="none" stroke="url(#avatarGlow)" stroke-width="4" filter="url(#circleGlow)"/>

  <!-- Tech Hexagon Aura -->
  <polygon points="160,35 260,95 260,225 160,285 60,225 60,95" fill="none" stroke="#6366f1" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Stylized Monogram / Developer Silhouette -->
  <!-- Head & Hair -->
  <circle cx="160" cy="115" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Developer Glasses / Cyber Visor -->
  <rect x="132" y="110" width="22" height="14" rx="4" fill="#00f2fe" fill-opacity="0.8"/>
  <rect x="166" y="110" width="22" height="14" rx="4" fill="#00f2fe" fill-opacity="0.8"/>
  <line x1="154" y1="117" x2="166" y2="117" stroke="#00f2fe" stroke-width="2"/>

  <!-- Body / Shoulders -->
  <path d="M 90 240 C 90 185 130 175 160 175 C 190 175 230 185 230 240 Z" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>

  <!-- Code bracket badge in front -->
  <circle cx="160" cy="225" r="20" fill="#0b0f19" stroke="#00f2fe" stroke-width="2"/>
  <text x="160" y="232" font-family="monospace" font-size="16" font-weight="bold" fill="#00f2fe" text-anchor="middle">&lt;/&gt;</text>

  <!-- Orbiting Nodes -->
  <circle cx="60" cy="95" r="6" fill="#00f2fe"/>
  <circle cx="260" cy="95" r="6" fill="#a855f7"/>
  <circle cx="260" cy="225" r="6" fill="#10b981"/>
  <circle cx="60" cy="225" r="6" fill="#fbbf24"/>
</svg>
