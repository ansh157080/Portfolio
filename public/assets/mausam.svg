<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="weatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="weatherGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#weatherBg)"/>

  <!-- Subtle Weather Isobars -->
  <path d="M 0 100 Q 150 60 300 110 T 600 90" fill="none" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M 0 160 Q 200 120 400 180 T 600 150" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M 0 220 Q 180 200 350 250 T 600 210" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Glowing Sun in background -->
  <circle cx="340" cy="130" r="45" fill="url(#sunGrad)" filter="url(#weatherGlow)"/>

  <!-- Cloud -->
  <g filter="url(#weatherGlow)">
    <path d="M 230 190 
             A 30 30 0 0 1 270 145 
             A 45 45 0 0 1 345 140 
             A 35 35 0 0 1 390 185 
             A 25 25 0 0 1 380 215 
             L 240 215 
             A 25 25 0 0 1 230 190 Z" 
          fill="url(#cloudGrad)" fill-opacity="0.9"/>
  </g>

  <!-- Rain / Weather Accents -->
  <line x1="260" y1="230" x2="250" y2="250" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="290" y1="230" x2="280" y2="250" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="320" y1="230" x2="310" y2="250" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="350" y1="230" x2="340" y2="250" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Category Badge Top Left -->
  <rect x="36" y="32" width="140" height="28" rx="14" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1"/>
  <text x="106" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">WEB DEV / SIH PROJECT</text>

  <!-- Live Temp Badge Top Right -->
  <rect x="440" y="32" width="124" height="28" rx="14" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1"/>
  <text x="502" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">LIVE RADAR 24°C</text>

  <!-- Metrics Bar Bottom -->
  <g transform="translate(170, 290)">
    <rect width="260" height="34" rx="8" fill="#111827" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
    <text x="130" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9ca3af" text-anchor="middle">
      Smart Alerts • Forecast • Interactive Radar
    </text>
  </g>
</svg>
